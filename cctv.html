<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">

<title>PRIMA CCTV</title>

<!-- Free peer-to-peer video: PeerJS cloud (signalling) + Google STUN -->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

/* ============================================================
   GLOBAL
============================================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

/* ============================================================
   VIDEO
============================================================ */

#remoteVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* ============================================================
   STATUS
============================================================ */

#status{
  position:fixed;
  top:20px;
  left:20px;
  z-index:100;
  max-width:calc(100% - 140px);
  padding:10px 16px;
  border-radius:8px;
  color:#fff;
  background:rgba(0,0,0,.65);
  font-size:14px;
  font-weight:600;
  backdrop-filter:blur(8px);
}

/* ============================================================
   LIVE INDICATOR
============================================================ */

#liveIndicator{
  position:fixed;
  top:20px;
  right:20px;
  z-index:100;
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:20px;
  color:#fff;
  background:rgba(0,0,0,.65);
  font-size:13px;
  font-weight:bold;
}

#liveDot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff2020;
  box-shadow:0 0 10px rgba(255,0,0,.8);
  animation:livePulse 1.4s ease-in-out infinite;
}

@keyframes livePulse{
  0%,100%{ opacity:1; }
  50%{ opacity:.35; }
}

/* ============================================================
   OFFLINE MESSAGE
============================================================ */

#offline{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:12px;
  padding:24px;
  color:#aaa;
  background:#000;
  text-align:center;
}

#offlineTitle{
  color:#fff;
  font-size:24px;
  font-weight:600;
}

#offlineText{
  color:#777;
  font-size:14px;
}

#offline.hidden{
  display:none;
}

/* ============================================================
   LOGIN
============================================================ */

#login{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:14px;
  padding:24px;
  color:#fff;
  background:#000;
  text-align:center;
}

#login.hidden{
  display:none;
}

#loginTitle{
  font-size:24px;
  font-weight:600;
}

#loginHint{
  color:#777;
  font-size:14px;
}

#passInput{
  width:min(320px,90vw);
  min-height:48px;
  padding:0 16px;
  border:1px solid #333;
  border-radius:10px;
  color:#fff;
  background:#111;
  font-size:18px;
  letter-spacing:2px;
  text-align:center;
}

#passInput:focus{
  outline:2px solid #4da3ff;
  outline-offset:2px;
}

#loginButton{
  width:min(320px,90vw);
  min-height:48px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:#2f7df6;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

#loginButton:hover{
  background:#4a90f7;
}

#loginButton:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}

#loginError{
  min-height:20px;
  color:#ff6b6b;
  font-size:14px;
}

</style>

</head>

<body>

<video
  id="remoteVideo"
  autoplay
  playsinline
  muted
  title="Double-click for full screen"
></video>

<div id="status" role="status" aria-live="polite">
  Connecting...
</div>

<div id="liveIndicator">
  <span id="liveDot"></span>
  LIVE CCTV
</div>

<div id="offline" class="hidden">
  <div id="offlineTitle">PRIMA CCTV</div>
  <div id="offlineText">Connecting to camera...</div>
</div>

<form id="login" class="hidden" autocomplete="off">
  <div id="loginTitle">PRIMA CCTV</div>
  <div id="loginHint">Enter the viewer passphrase</div>
  <label for="passInput" style="position:absolute;left:-9999px">Passphrase</label>
  <input
    id="passInput"
    type="password"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    maxlength="100"
    required
  >
  <button id="loginButton" type="submit">Connect</button>
  <div id="loginError" role="alert"></div>
</form>

<script>

/* ============================================================
   SETTINGS
============================================================ */

/* Must be identical to CCTV_PEER_ID in index.html. */
const CCTV_PEER_ID = "kkah-welcome-cam-gz345w9dgy";

/*
   Optional free TURN relay (only used when a direct connection
   is blocked by the network). See the note in index.html.
   Example:
   https://YOURAPP.metered.live/api/v1/turn/credentials?apiKey=YOURKEY
*/
const CCTV_TURN_CREDENTIALS_URL = "";

const RETRY_MS = 5000;
const BUSY_RETRY_MS = 15000;
const STREAM_TIMEOUT_MS = 25000;
const STORAGE_KEY = "prima-cctv-pass";

/* ============================================================
   ELEMENTS
============================================================ */

const video = document.getElementById("remoteVideo");
const statusBox = document.getElementById("status");
const liveIndicator = document.getElementById("liveIndicator");
const offline = document.getElementById("offline");
const offlineText = document.getElementById("offlineText");
const login = document.getElementById("login");
const loginError = document.getElementById("loginError");
const passInput = document.getElementById("passInput");

/* ============================================================
   STATE
============================================================ */

let peer = null;
let conn = null;
let call = null;
let retryTimer = null;
let streamTimer = null;
let passphrase = "";
let live = false;

/* Increases on every connect(); callbacks of older sessions are ignored. */
let session = 0;

/* ============================================================
   UI HELPERS
============================================================ */

function setStatus(text){
  statusBox.textContent = text;
}

function showOffline(text){
  live = false;
  offlineText.textContent = text;
  offline.classList.remove("hidden");
  liveIndicator.style.display = "none";
}

function showLive(){
  live = true;
  clearTimeout(streamTimer);
  offline.classList.add("hidden");
  liveIndicator.style.display = "flex";
  setStatus("🔴 LIVE CCTV");
}

function showLogin(message){
  teardown();
  offline.classList.add("hidden");
  login.classList.remove("hidden");
  loginError.textContent = message || "";
  passInput.value = "";
  passInput.focus();
  setStatus("Passphrase required");
}

function hideLogin(){
  login.classList.add("hidden");
}

function readSaved(){
  try{ return sessionStorage.getItem(STORAGE_KEY) || ""; }
  catch(error){ return ""; }
}

function writeSaved(value){
  try{
    if(value){ sessionStorage.setItem(STORAGE_KEY, value); }
    else{ sessionStorage.removeItem(STORAGE_KEY); }
  }catch(error){}
}

/* ============================================================
   ICE SERVERS (STUN + optional free TURN)
============================================================ */

async function getIceServers(){

  const servers = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ];

  if(CCTV_TURN_CREDENTIALS_URL){
    try{
      const response = await fetch(CCTV_TURN_CREDENTIALS_URL);
      const data = await response.json();
      const extra = Array.isArray(data) ? data : data.iceServers;
      if(Array.isArray(extra)){ servers.push(...extra); }
    }catch(error){
      console.warn("TURN credentials unavailable, using STUN only:", error);
    }
  }

  return servers;
}

/* ============================================================
   CONNECTION
============================================================ */

function teardown(){

  clearTimeout(retryTimer);
  clearTimeout(streamTimer);

  try{ if(call){ call.close(); } }catch(error){}
  try{ if(conn){ conn.close(); } }catch(error){}
  try{ if(peer){ peer.destroy(); } }catch(error){}

  call = null;
  conn = null;
  peer = null;
  live = false;

  video.srcObject = null;
  liveIndicator.style.display = "none";
}

function retry(message, delayMs){

  showOffline(message + " • retrying...");
  setStatus("Reconnecting...");

  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, delayMs || RETRY_MS);
}

async function connect(){

  const mySession = ++session;
  const stale = () => mySession !== session;

  teardown();

  if(typeof Peer === "undefined"){
    retry("Cannot load the PeerJS library (network blocked?)", BUSY_RETRY_MS);
    return;
  }

  showOffline("Connecting to camera...");
  setStatus("Connecting...");

  const iceServers = await getIceServers();

  if(stale()){ return; }

  peer = new Peer({ debug:1, config:{ iceServers } });

  /* ---------- signalling server reached ---------- */

  peer.on("open", () => {

    if(stale()){ return; }

    conn = peer.connect(CCTV_PEER_ID, { reliable:true });

    conn.on("open", () => {
      if(stale()){ return; }
      conn.send({ type:"auth", pass:passphrase });
    });

    conn.on("data", message => {

      if(stale() || !message){ return; }

      if(message.type === "auth-ok"){

        setStatus("Waiting for video...");

        streamTimer = setTimeout(() => {
          if(!stale() && !live){ retry("No video received"); }
        }, STREAM_TIMEOUT_MS);

      }else if(message.type === "auth-failed"){

        ++session;
        writeSaved("");
        showLogin("Wrong passphrase. Please try again.");

      }else if(message.type === "busy"){

        retry("Too many viewers right now", BUSY_RETRY_MS);

      }else if(message.type === "offline"){

        retry("Camera is not ready");

      }
    });

    conn.on("close", () => {
      if(!stale()){ retry("Camera connection closed"); }
    });

    conn.on("error", error => {
      console.warn("Data connection error:", error);
    });
  });

  /* ---------- camera calls us with the video ---------- */

  peer.on("call", incoming => {

    if(stale()){ return; }

    call = incoming;
    incoming.answer();

    incoming.on("stream", stream => {

      if(stale()){ return; }

      video.srcObject = stream;
      video.play().catch(error => console.warn("Autoplay issue:", error));
      showLive();
    });

    incoming.on("close", () => {
      if(!stale()){ retry("Camera stream ended"); }
    });

    incoming.on("error", () => {
      if(!stale()){ retry("Camera stream error"); }
    });
  });

  /* ---------- errors ---------- */

  peer.on("error", error => {

    if(stale()){ return; }

    console.warn("Peer error:", error.type);

    if(error.type === "peer-unavailable"){
      retry("Camera is offline (it runs in day mode only)");
    }else{
      retry("Connection problem (" + error.type + ")");
    }
  });

  /* Signalling lost: an active video call keeps running without it. */

  peer.on("disconnected", () => {
    if(!stale() && !live){ retry("Signalling server disconnected"); }
  });
}

/* ============================================================
   LOGIN FORM
============================================================ */

login.addEventListener("submit", event => {

  event.preventDefault();

  passphrase = passInput.value.trim();

  if(!passphrase){ return; }

  writeSaved(passphrase);
  hideLogin();
  connect();
});

/* ============================================================
   FULL SCREEN (double-click / double-tap)
============================================================ */

video.addEventListener("dblclick", () => {

  if(document.fullscreenElement){
    document.exitFullscreen();
  }else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

/* ============================================================
   START
============================================================ */

passphrase = readSaved();

if(passphrase){
  connect();
}else{
  showLogin("");
}

</script>

</body>

</html>
