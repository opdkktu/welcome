<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PRIMA CCTV TEST</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#remoteVideo{
  width:90vw;
  max-width:1000px;
  max-height:75vh;
  background:#111;
  object-fit:contain;
}

#status{
  margin-top:20px;
  font-size:18px;
}

#roomInfo{
  margin-top:8px;
  color:#888;
}

button{
  margin-top:20px;
  padding:12px 25px;
  font-size:16px;
  cursor:pointer;
}

</style>
</head>

<body>

<video
  id="remoteVideo"
  autoplay
  playsinline
  controls="false"
></video>

<div id="status">
  Connecting...
</div>

<div id="roomInfo">
  Room: PRIMA-CCTV-TEST
</div>

<button id="disconnectButton">
  Disconnect
</button>


<script type="module">

import {
  Room,
  RoomEvent,
  Track,
  TokenSource
}
from
"https://cdn.jsdelivr.net/npm/livekit-client@2.22.0/+esm";


/* ============================================================
   SETTINGS
============================================================ */

const TOKEN_SERVER_ID =
  "welcomecameracctv-osezp5";


const ROOM_NAME =
  "PRIMA-CCTV-TEST";


const statusBox =
  document.getElementById("status");


const remoteVideo =
  document.getElementById("remoteVideo");


const disconnectButton =
  document.getElementById("disconnectButton");


/* ============================================================
   LIVEKIT
============================================================ */

let room = null;


/* ============================================================
   CONNECT
============================================================ */

async function connectToLiveKit(){

  try{

    statusBox.textContent =
      "Getting LiveKit token...";


    /*
       Development Token Server

       This is ONLY for testing.

       It must NOT be used for the
       final clinic CCTV system.
    */

    const tokenSource =
      TokenSource.developmentTokenServer(
        TOKEN_SERVER_ID
      );


    const connectionDetails =
      await tokenSource.fetch({
        roomName:ROOM_NAME
      });


    console.log(
      "LiveKit server:",
      connectionDetails.serverUrl
    );


    room =
      new Room({
        adaptiveStream:true,
        dynacast:true
      });


    /*
       Remote track received
    */

    room.on(
      RoomEvent.TrackSubscribed,
      (
        track,
        publication,
        participant
      ) => {

        console.log(
          "Track subscribed:",
          track.kind,
          participant.identity
        );


        if(
          track.kind === Track.Kind.Video
        ){

          const element =
            track.attach();


          element.autoplay =
            true;

          element.playsInline =
            true;

          element.controls =
            false;

          remoteVideo.srcObject =
            element.srcObject;


          statusBox.textContent =
            "🟢 LIVE CCTV";


          console.log(
            "Remote video attached."
          );

        }

      }
    );


    /*
       Track removed
    */

    room.on(
      RoomEvent.TrackUnsubscribed,
      (
        track
      ) => {

        track.detach();

      }
    );


    /*
       Connection lost
    */

    room.on(
      RoomEvent.Disconnected,
      () => {

        statusBox.textContent =
          "🔴 Disconnected";

      }
    );


    /*
       Connect to LiveKit
    */

    await room.connect(
      connectionDetails.serverUrl,
      connectionDetails.participantToken
    );


    console.log(
      "Connected to room:",
      room.name
    );


    statusBox.textContent =
      "Connected — waiting for camera...";


  }catch(error){

    console.error(
      "LiveKit connection error:",
      error
    );


    statusBox.textContent =
      "❌ Connection failed — check console";


  }

}


/* ============================================================
   DISCONNECT
============================================================ */

disconnectButton.addEventListener(
  "click",
  async () => {

    if(room){

      await room.disconnect();

      statusBox.textContent =
        "Disconnected";

    }

  }
);


/* ============================================================
   START
============================================================ */

connectToLiveKit();

</script>

</body>
</html>
