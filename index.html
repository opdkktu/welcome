<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Welcome Screen</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:
  "Segoe UI",
  "SF Pro Display",
  sans-serif;
}

/* =========================
   IDLE SCREEN
========================= */

#idle{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  background:
  radial-gradient(circle at center,
  #111 0%,
  #050505 45%,
  #000 100%);
}

#clock{
  font-size:9vw;
  font-weight:100;
  color:white;
  letter-spacing:6px;

  text-shadow:
  0 0 px rgba(255,255,255,.08);

  user-select:none;
}

#date{
  margin-top:12px;
  color:#888;
  font-size:1.2vw;
  letter-spacing:4px;
}

/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  background:black;

  opacity:0;
  visibility:hidden;

  transition:
  opacity .8s ease,
  visibility .8s ease;

  z-index:100;
}

#welcomeScreen.show{
  opacity:1;
  visibility:visible;
}

#welcomeImage{
  max-width:85%;
  max-height:85%;

  transform:scale(.9);
  transition:transform .8s ease;

  filter:
  drop-shadow(0 0 30px rgba(255,255,255,.15));
}

#welcomeScreen.show #welcomeImage{
  transform:scale(1);
}
/* =========================
   GENERAL ANNOUNCEMENT
========================= */

#announcementScreen{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  background:black;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .5s ease,
    visibility .5s ease;

  z-index:10000;
}

#announcementScreen.show{
  opacity:1;
  visibility:visible;
}

#announcementImage{
  max-width:90%;
  max-height:90%;

  object-fit:contain;

  filter:
    drop-shadow(0 0 35px rgba(255,255,255,.15));
}
/* =========================
   CAMERA
========================= */

video{
  position:fixed;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* =========================
   STATUS
========================= */

#status{
  position:fixed;
  bottom:68px;
  right:20px;

  font-size:12px;
  color:#555;

  z-index:99999;
}

/* =========================
   QR
========================= */

#qrPanel{
  position:fixed;
  top:40px;
  right:40px;

  transform:translateX(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:15px;
  padding:0;

  background:none;
  backdrop-filter:blur(12px);

  border:none;
  border-radius:20px;
}

#qrCode{
  width:220px;
  height:220px;

  background:white;
  padding:12px;
  border-radius:16px;

  box-shadow:
    0 10px 40px rgba(0,0,0,.4);
}

.qrTitle{
  color:white;
  font-size:14px;
  font-weight:600;
  letter-spacing:2px;
}

.qrSub{
  color:#aaa;
  margin-top:4px;
  font-size:13px;
}

/* =========================
   ANIMATED SCAN ARROW
========================= */

#scanArrow{
  position:fixed;
  top:270px;
  right:120px;

  pointer-events:none;
  z-index:999;

  display:flex;
  flex-direction:column;
  align-items:center;
}
#scanArrow.announcementHidden{
  display:none !important;
}
.scanLabel{

  color:#ff3030;

  font-size:26px;
  font-weight:900;
  letter-spacing:3px;

  margin-top:10px;

  animation:
    textBlink .6s infinite alternate;

  text-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px red;
}

#scanArrow svg{
  overflow:visible;
}

#snakePath{
  fill:none;

  stroke:#ff2020;
  stroke-width:6;
  stroke-linecap:round;

  marker-end:url(#arrowHead);

  stroke-dasharray:12 12;

  animation:
    snakeMove .45s linear infinite;

  filter:
    drop-shadow(0 0 10px red)
    drop-shadow(0 0 18px red);

  mask:url(#trailMask);
}

#arrowHead{
  animation:pulseArrow .8s infinite;
}

@keyframes textBlink {
  from { opacity:.5; }
  to   { opacity:1; }
}

/* =========================
   BOTTOM SAFETY TICKER
========================= */

#ticker{
  position:fixed;

  left:0;
  bottom:0;

  width:100%;
  height:48px;

  background:rgba(0,0,0,.85);

  border-top:2px solid #ffd400;

  overflow:hidden;

  z-index:9999;
}

#tickerText{
  position:absolute;

  white-space:nowrap;

  color:#ffd400;

  font-size:34px;
  font-weight:700;

  line-height:48px;

  padding-left:100%;

  text-shadow:
    0 0 6px rgba(255,212,0,.7);

  animation:
    tickerMove 28s linear infinite;
}

@keyframes tickerMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-100%);
  }
}
/* ============================================================
   PRIMA NIGHT MODE
============================================================ */

#nightMode{
  position:fixed;
  inset:0;

  background:#000;

  display:none;

  z-index:999999;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  color:#111;

  pointer-events:none;
}

#nightMode.active{
  display:flex;
}

#nightModeStatus{
  font-size:1px;
  opacity:0;
}

body.night-mode{
  background:#000 !important;
}
</style>
</head>

<!-- =========================

========================= -->

<div id="welcomeScreen">

<div id="announcementScreen">

<audio

<script type="module">

/* ============================================================
   MEDIAPIPE
============================================================ */

import {
  FilesetResolver,
  FaceDetector
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";


/* ============================================================
   ELEMENTS
============================================================ */

const video =
  document.getElementById("webcam");

const audio =
  document.getElementById("welcomeAudio");

const welcomeScreen =
  document.getElementById("welcomeScreen");

const statusBox =
  document.getElementById("status");

const announcementScreen =
  document.getElementById("announcementScreen");

const announcementImage =
  document.getElementById("announcementImage");

const announcementBell =
  document.getElementById("announcementBell");

const announcementAudio =
  document.getElementById("announcementAudio");

const scanArrow =
  document.getElementById("scanArrow");

const nightMode =
  document.getElementById("nightMode");


/* ============================================================
   GOOGLE APPS SCRIPT UPLOAD URL
============================================================ */

const UPLOAD_URL =
  "https://script.google.com/macros/s/AKfycbwk5KkSK1kZCIMqG8ITAiNXKYioQGO8R-ODWOpZUsKjKdjLWylfC_XXhqAD-VI12iA7/exec";


/* ============================================================
   CAMERA SETTINGS
============================================================ */

const CAMERA_WIDTH = 640;
const CAMERA_HEIGHT = 480;


/* ============================================================
   DAY / NIGHT SETTINGS
============================================================ */

/*
   PRIMA DAY MODE:
   07:00 → 17:00

   PRIMA NIGHT MODE:
   17:00 → 07:00
*/

const DAY_START_HOUR = 7;
const DAY_START_MINUTE = 0;

const NIGHT_START_HOUR = 17;
const NIGHT_START_MINUTE = 20;


/* ============================================================
   AI VARIABLES
============================================================ */

let detector = null;

let triggered = false;

let lastSeen = 0;

let showingWelcome = false;

let detectionRunning = false;

let systemStarting = false;

let currentDayMode = false;

/* ============================================================
   TIMESTAMP VIDEO CANVAS
============================================================ */

let recordingCanvas = null;
let recordingCanvasContext = null;
let recordingCanvasStream = null;
let timestampAnimationFrame = null;
  /* ============================================================
     CCTV WEBRTC
============================================================ */

const CCTV_WS_URL =
  "wss://YOUR-CCTV-WORKER.workers.dev/ws";

let cctvSocket = null;

let cctvPeer = null;

let cctvActive = false;
/* ============================================================
   RECORDING SETTINGS
============================================================ *

/* Additional recording windows */
const RECORDING_WINDOWS = [
  { start: "07:10", end: "08:00" },
  { start: "17:00", end: "17:16" }
];


/*
   CURRENT SETTING = 1 MINUTE

   For 5-minute recordings use:

   2 * 60 * 1000
*/

const RECORDING_INTERVAL_MS =
  1 * 60 * 1000;


const VIDEO_BITRATE = 500000;


/* ============================================================
   GENERAL ANNOUNCEMENT
============================================================ */

const ANNOUNCEMENT_TIMES = [
  "08:00",
  "09:30",
  "11:00",
  "12:00",
  "14:00",
  "15:00",
  "16:00"
];

const BELL_URL =
  "https://opdkktu.github.io/trial1/bell.mp3";

const NASIHAT_AUDIO =
  "nasihat1.mp3";

const NASIHAT_IMAGE =
  "nasihat1.jpg";

let announcementActive = false;

let lastAnnouncementKey = "";


/* ============================================================
   RECORDING VARIABLES
============================================================ */

let mediaRecorder = null;

let recordingChunks = [];

let recordingStartTime = null;

let recordingTimer = null;

let recordingActive = false;

let uploadInProgress = false;


/* ============================================================
   DAY / NIGHT TIME FUNCTIONS
============================================================ */

function getCurrentMinutes(){
  const now = new Date();
  return (
    now.getHours() * 60 +
    now.getMinutes()
  );
}

function getDayStartMinutes(){
  return (
    DAY_START_HOUR * 60 +
    DAY_START_MINUTE
  );
}

function getNightStartMinutes(){
  return (
    NIGHT_START_HOUR * 60 +
    NIGHT_START_MINUTE
  );
}

/*
   Returns TRUE when PRIMA should be active.

   07:20 → 16:59 = DAY
   17:00 → 07:19 = NIGHT
*/

function shouldBeDayMode(){

  const minutes =
    getCurrentMinutes();

  return (
    minutes >= getDayStartMinutes() &&
    minutes < getNightStartMinutes()
  );
}

/* ============================================================
   STOP CAMERA COMPLETELY
============================================================ */

function stopCamera(){
  console.log(
    "Stopping camera..."
  );

  if(video.srcObject){

    const tracks =
      video.srcObject.getTracks();

    tracks.forEach(track => {

      try{

        track.stop();

      }catch(error){

        console.error(
          "Camera track stop error:",
          error
        );
      }
    });
    video.srcObject = null;
  }
  video.pause();
}

/* ============================================================
   STOP AI
============================================================ */

function stopAI(){
  console.log(
    "Stopping MediaPipe..."
  );
  detectionRunning = false;

  /*
     MediaPipe detector has close()
     in current Tasks Vision versions.
  */

  if(detector){
    try{
      if(
        typeof detector.close ===
        "function"
      ){
        detector.close();
      }
    }catch(error){
      console.error(
        "Detector close error:",
        error
      );
    }
  }
  detector = null;
}
/* ============================================================
   STOP RECORDING
============================================================ */

function forceStopRecording(){
  if(recordingTimer){
    clearTimeout(
      recordingTimer
    );
    recordingTimer = null;
  }

  if(
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ){
    try{
      mediaRecorder.stop();
    }catch(error){
      console.error(
        "Recorder stop error:",
        error
      );
    }
  }
}

/* ============================================================
   ENTER NIGHT MODE
============================================================ */

async function enterNightMode(){
  if(!currentDayMode){
    return;
  }

  console.log(
    "================================="
  );

  console.log(
    "PRIMA ENTERING NIGHT MODE"
  );

  console.log(
    "Camera OFF"
  );

  console.log(
    "AI OFF"
  );

  console.log(
    "Screen BLACK"
  );

  console.log(
    "================================="
  );


  currentDayMode = false;
  /*
     Stop recording first.
  */

  forceStopRecording();

  /*
     Stop welcome audio.
  */

  try{
    audio.pause();
    audio.currentTime = 0;
  }catch(error){
    console.error(error);
  }

  /*
     Stop announcement audio.
  */

  try{
    announcementBell.pause();
    announcementBell.currentTime = 0;
    announcementAudio.pause();
    announcementAudio.currentTime = 0;
  }catch(error){
    console.error(error);
  }


  announcementActive = false;

  /*
     Hide all normal PRIMA UI.
  */

  welcomeScreen.classList.remove(
    "show"
  );

  announcementScreen.classList.remove(
    "show"
  );

  scanArrow.classList.add(
    "announcementHidden"
  );


  /*
     Stop AI first.
  */

  stopAI();


  /*
     Release camera hardware.
  */

  stopCamera();


  /*
     Hide ticker.
  */

  const ticker =
    document.getElementById("ticker");

  if(ticker){

    ticker.style.display = "none";

  }


  /*
     Hide QR.
  */

  const qrPanel =
    document.getElementById("qrPanel");

  if(qrPanel){

    qrPanel.style.display = "none";

  }


  /*
     Hide status.
  */

  statusBox.style.display =
    "none";


  /*
     Activate full black screen.
  */

  nightMode.classList.add(
    "active"
  );

  document.body.classList.add(
    "night-mode"
  );


  /*
     Make absolutely sure video is hidden.
  */

  video.style.display = "none";


  /*
     Prevent accidental visitor trigger.
  */

  triggered = false;

  showingWelcome = false;


  /*
     From this point onward,
     there is NO camera processing.
  */

}


/* ============================================================
   ENTER DAY MODE
============================================================ */

async function enterDayMode(){

  if(currentDayMode){

    return;

  }

  if(systemStarting){

    return;

  }

  console.log(
    "================================="
  );

  console.log(
    "PRIMA ENTERING DAY MODE"
  );

  console.log(
    "================================="
  );


  systemStarting = true;


  try{

    currentDayMode = true;


    /*
       Remove black screen.
    */

    nightMode.classList.remove(
      "active"
    );

    document.body.classList.remove(
      "night-mode"
    );


    /*
       Restore UI.
    */

    video.style.display = "";


    const ticker =
      document.getElementById("ticker");

    if(ticker){

      ticker.style.display = "";

    }


    const qrPanel =
      document.getElementById("qrPanel");

    if(qrPanel){

      qrPanel.style.display = "";

    }


    statusBox.style.display =
      "";


    scanArrow.classList.remove(
      "announcementHidden"
    );


    statusBox.textContent =
      "Starting camera...";


    /*
       Start camera.
    */

    await initCamera();


    /*
       IMPORTANT:

       Check again after camera startup.

       If the system crossed 17:00 while
       initialization was happening, immediately
       return to night mode.
    */

    if(!shouldBeDayMode()){
      await enterNightMode();
      return;
    }
startCCTV();
    statusBox.textContent =
      "Loading AI model...";

    /*
       Start MediaPipe.
    */

    await initAI();


    /*
       Again check operating time.
    */

    if(!shouldBeDayMode()){

      await enterNightMode();

      return;

    }


    statusBox.textContent =
      "Ready";


    /*
       Start face detection.
    */

    if(!detectionRunning){

      detectionRunning = true;

      detectLoop();

    }


    /*
       Start recording scheduler immediately.

       This allows the system to start recording
       immediately if Chrome was opened after 07:20.
    */
    recordingScheduler();
    console.log(
      "PRIMA DAY MODE READY"
    );

  }catch(error){

    console.error(
      "DAY MODE START ERROR:",
      error
    );

    statusBox.textContent =
      "Camera permission required";
    /*
       If camera/AI failed, don't leave
       the system half-active.
    */
stopCCTV();
    stopAI();
    stopCamera();
    currentDayMode = false;
  }finally{
    systemStarting = false;
  }
}
/* ============================================================
   DAY / NIGHT CONTROLLER
============================================================ */

async function updateDayNightMode(){

  const shouldDay =
    shouldBeDayMode();


  /*
     Currently NIGHT,
     but it is now operating time.
  */

  if(
    shouldDay &&
    !currentDayMode &&
    !systemStarting
  ){

    await enterDayMode();

    return;

  }


  /*
     Currently DAY,
     but operating hours have ended.
  */

  if(
    !shouldDay &&
    currentDayMode &&
    !systemStarting
  ){

    await enterNightMode();

    return;

  }

}


/*
   Check every 10 seconds.

   This is very lightweight.

   During night mode this is essentially the
   only timer doing meaningful work.
*/

setInterval(
  updateDayNightMode,
  10000
);


/* ============================================================
   CAMERA
============================================================ */

async function initCamera(){

  /*
     If an old stream exists,
     release it first.
  */

  stopCamera();


  const stream =
    await navigator.mediaDevices.getUserMedia({

      video:{

        width:{
          ideal:CAMERA_WIDTH
        },

        height:{
          ideal:CAMERA_HEIGHT
        },

        facingMode:"user"

      },

      audio:false

    });


  /*
     Make sure the system is still supposed
     to be running.
  */

  if(!shouldBeDayMode()){

    stream
      .getTracks()
      .forEach(track => track.stop());

    throw new Error(
      "Operating hours ended while camera was starting."
    );

  }


  video.srcObject =
    stream;


  return new Promise(
    (resolve,reject)=>{

      video.onloadedmetadata = ()=>{

        resolve();

      };

      video.onerror = error => {

        reject(error);

      };

    }
  );

}

/* ============================================================
   CCTV WEBRTC PUBLISHER
============================================================ */

function startCCTV(){

  /*
     CCTV only works during DAY MODE.
  */

  if(!currentDayMode){

    console.log(
      "CCTV not started: NIGHT MODE"
    );

    return;

  }


  /*
     Camera must already be running.
  */

  if(!video.srcObject){

    console.warn(
      "CCTV cannot start: camera unavailable."
    );

    return;

  }


  /*
     Don't create duplicate connections.
  */

  if(cctvSocket){

    console.log(
      "CCTV signaling already connected."
    );

    return;

  }


  console.log(
    "Starting PRIMA CCTV..."
  );


  cctvSocket =
    new WebSocket(
      CCTV_WS_URL
    );


  /* ========================================================
     CONNECTED
  ======================================================== */

  cctvSocket.onopen = () => {

    console.log(
      "CCTV signaling connected."
    );


    /*
       Tell the server:

       This Chromebook is the CAMERA
       publisher.
    */

    cctvSocket.send(

      JSON.stringify({

        type:
          "publisher"

      })

    );

  };


  /* ========================================================
     MESSAGE
  ======================================================== */

  cctvSocket.onmessage =
    async event => {

      try{

        const message =
          JSON.parse(
            event.data
          );


        /*
           A viewer has opened cctv.html.
        */

        if(
          message.type ===
          "viewer-ready"
        ){

          console.log(
            "CCTV viewer connected."
          );


          await createCCTVOffer();

        }


        /*
           Viewer answered our offer.
        */

        else if(
          message.type ===
          "answer"
        ){

          if(!cctvPeer){

            return;

          }


          await cctvPeer.setRemoteDescription(

            new RTCSessionDescription(
              message.answer
            )

          );


          console.log(
            "CCTV remote description set."
          );

        }


        /*
           ICE candidate from viewer.
        */

        else if(
          message.type ===
          "candidate"
        ){

          if(
            cctvPeer &&
            message.candidate
          ){

            try{

              await cctvPeer.addIceCandidate(

                new RTCIceCandidate(
                  message.candidate
                )

              );

            }catch(error){

              console.error(
                "CCTV ICE candidate error:",
                error
              );

            }

          }

        }

      }catch(error){

        console.error(
          "CCTV message error:",
          error
        );

      }

    };


  /* ========================================================
     ERROR
  ======================================================== */

  cctvSocket.onerror =
    error => {

      console.error(
        "CCTV signaling error:",
        error
      );

    };


  /* ========================================================
     CLOSED
  ======================================================== */

  cctvSocket.onclose =
    () => {

      console.log(
        "CCTV signaling disconnected."
      );


      cctvSocket =
        null;


      cctvActive =
        false;


      if(cctvPeer){

        try{

          cctvPeer.close();

        }catch(error){

          console.error(
            error
          );

        }

        cctvPeer =
          null;

      }

    };

}


/* ============================================================
   CREATE CCTV WEBRTC OFFER
============================================================ */

async function createCCTVOffer(){

  /*
     Don't create CCTV if
     Night Mode has started.
  */

  if(!currentDayMode){

    return;

  }


  if(!video.srcObject){

    return;

  }


  /*
     Close previous peer connection.
  */

  if(cctvPeer){

    try{

      cctvPeer.close();

    }catch(error){

      console.error(
        error
      );

    }

  }


  /*
     Create WebRTC connection.
  */

  cctvPeer =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  /*
     IMPORTANT:

     Reuse the EXISTING PRIMA camera.

     We are NOT calling getUserMedia()
     again.
  */

  video.srcObject
    .getTracks()
    .forEach(track => {

      cctvPeer.addTrack(

        track,

        video.srcObject

      );

    });


  /*
     Send ICE candidates
     to Cloudflare signaling server.
  */

  cctvPeer.onicecandidate =
    event => {

      if(
        event.candidate &&
        cctvSocket &&
        cctvSocket.readyState ===
          WebSocket.OPEN
      ){

        cctvSocket.send(

          JSON.stringify({

            type:
              "candidate",

            candidate:
              event.candidate

          })

        );

      }

    };


  /*
     Connection state.
  */

  cctvPeer.onconnectionstatechange =
    () => {

      console.log(
        "CCTV connection:",
        cctvPeer.connectionState
      );


      if(
        cctvPeer.connectionState ===
        "connected"
      ){

        cctvActive =
          true;

      }


      if(
        cctvPeer.connectionState ===
          "failed" ||
        cctvPeer.connectionState ===
          "disconnected" ||
        cctvPeer.connectionState ===
          "closed"
      ){

        cctvActive =
          false;

      }

    };


  /*
     Create WebRTC offer.
  */

  const offer =
    await cctvPeer.createOffer();


  await cctvPeer.setLocalDescription(
    offer
  );


  /*
     Send offer to viewer.
  */

  if(
    cctvSocket &&
    cctvSocket.readyState ===
      WebSocket.OPEN
  ){

    cctvSocket.send(

      JSON.stringify({

        type:
          "offer",

        offer:
          cctvPeer.localDescription

      })

    );

  }

}

function waitForAudioEnd(
  audioElement
){

  return new Promise(resolve => {

    const finished = () => {

      audioElement.removeEventListener(
        "ended",
        finished
      );

      resolve();

    };

    audioElement.addEventListener(
      "ended",
      finished
    );

  });

}

/* ============================================================
   RECORDING TIME
============================================================ */

function isRecordingTime(){

  /*
     Recording is NEVER allowed
     during night mode.
  */

  if(!currentDayMode){

    return false;

  }


  const now =
    new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  /*
     Check all recording windows.
  */

  return RECORDING_WINDOWS.some(
    window => {

      const [startHour,startMinute] =
        window.start
          .split(":")
          .map(Number);

      const [endHour,endMinute] =
        window.end
          .split(":")
          .map(Number);


      const start =
        startHour * 60 +
        startMinute;


      const end =
        endHour * 60 +
        endMinute;


      return (
        currentMinutes >= start &&
        currentMinutes < end
      );

    }
  );

}


/* ============================================================
   FORMAT DATE
============================================================ */

function pad(number){

  return String(number)
    .padStart(2,"0");

}


function formatDate(date){

  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate())
  );

}


function formatTime(date){

  return (
    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes()) +
    ":" +
    pad(date.getSeconds())
  );

}


/* ============================================================
   CREATE FILENAME
============================================================ */

function createRecordingFilename(
  startDate,
  endDate
){

  const date =
    formatDate(startDate);


  const start =
    pad(startDate.getHours()) +
    pad(startDate.getMinutes());


  const end =
    pad(endDate.getHours()) +
    pad(endDate.getMinutes());


  return (
    "PRIMA_" +
    date +
    "_" +
    start +
    "-" +
    end +
    ".webm"
  );

}


/* ============================================================
   MEDIARECORDER FORMAT
============================================================ */

function getSupportedMimeType(){

  const types = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for(
    const type of types
  ){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;

    }

  }


  return "";

}
/* ============================================================
   CREATE TIMESTAMPED VIDEO STREAM
============================================================ */

function createTimestampedVideoStream(){

  /*
     Create canvas only once.
  */

  if(!recordingCanvas){

    recordingCanvas =
      document.createElement("canvas");

    recordingCanvas.width =
      CAMERA_WIDTH;

    recordingCanvas.height =
      CAMERA_HEIGHT;

    recordingCanvasContext =
      recordingCanvas.getContext("2d");

  }


  /*
     Draw camera frame + timestamp.
  */

  function drawFrame(){

    /*
       Stop drawing if recording has ended.
    */

    if(!recordingActive){

      timestampAnimationFrame = null;

      return;

    }


    const ctx =
      recordingCanvasContext;


    /*
       Draw current camera frame.
    */

    ctx.drawImage(
      video,
      0,
      0,
      recordingCanvas.width,
      recordingCanvas.height
    );


    /* ========================================================
       TIMESTAMP
    ======================================================== */

    const now =
      new Date();


    const timestamp =
      String(now.getDate()).padStart(2,"0") +
      "/" +
      String(
        now.getMonth() + 1
      ).padStart(2,"0") +
      "/" +
      now.getFullYear() +
      " " +
      String(
        now.getHours()
      ).padStart(2,"0") +
      ":" +
      String(
        now.getMinutes()
      ).padStart(2,"0") +
      ":" +
      String(
        now.getSeconds()
      ).padStart(2,"0");


    /*
       Timestamp font.
    */

    ctx.font =
      "bold 18px Arial";


    /*
       Measure text.
    */

    const textWidth =
      ctx.measureText(
        timestamp
      ).width;


    const padding = 8;


    const x =
      recordingCanvas.width -
      textWidth -
      padding * 2 -
      10;


    const y =
      recordingCanvas.height -
      10;


    /*
       Semi-transparent black background.
    */

    ctx.fillStyle =
      "rgba(0,0,0,0.65)";


    ctx.fillRect(

      x,

      y - 25,

      textWidth +
      padding * 2,

      25

    );


    /*
       White timestamp.
    */

    ctx.fillStyle =
      "#ffffff";


    ctx.textBaseline =
      "middle";


    ctx.fillText(

      timestamp,

      x + padding,

      y - 12

    );


    /*
       Continue drawing.

       Approximately 30 FPS.
    */

    timestampAnimationFrame =
      requestAnimationFrame(
        drawFrame
      );

  }


  /*
     Create canvas video stream.
  */

  recordingCanvasStream =
    recordingCanvas.captureStream(30);


  /*
     Start drawing.
  */

  timestampAnimationFrame =
    requestAnimationFrame(
      drawFrame
    );


  return recordingCanvasStream;

}

/* ============================================================
   START RECORDING
============================================================ */

function startRecording(){

  if(
    recordingActive
  ){

    return;

  }


  /*
     Never record at night.
  */

  if(!currentDayMode){

    return;

  }


  if(
    !video.srcObject
  ){

    console.error(
      "Camera stream unavailable."
    );

    return;

  }


  if(
    !isRecordingTime()
  ){

    return;

  }
 /*
     Make sure camera is ready.
  */

  if(
    video.readyState < 2
  ){

    console.warn(
      "Camera video is not ready."
    );

    return;

  }

  const mimeType =
    getSupportedMimeType();


  recordingChunks = [];


  recordingStartTime =
    new Date();

  recordingActive = true;
   /*
     Create:

     CAMERA
        ↓
     CANVAS
        ↓
     TIMESTAMP
        ↓
     MEDIARECORDER
  */

  const timestampStream =
    createTimestampedVideoStream();


  try{

    mediaRecorder =
      mimeType

      ?

      new MediaRecorder(
        timestampStream,
        {

          mimeType:mimeType,

          videoBitsPerSecond:
            VIDEO_BITRATE

        }
      )

      :

      new MediaRecorder(
        timestampStream,
      );


  }catch(error){

    console.error(
      "MediaRecorder failed:",
      error
    );
    recordingActive = false;


    /*
       Stop timestamp canvas stream.
    */

    stopTimestampVideoStream();

    statusBox.textContent =
      "Recording unavailable";


    return;

  }


  mediaRecorder.ondataavailable =
    event => {

      if(
        event.data &&
        event.data.size > 0
      ){

        recordingChunks.push(
          event.data
        );

      }

    };


  mediaRecorder.onstop =
    async () => {

      await finishRecording();

    };


  mediaRecorder.onerror =
    event => {

      console.error(
        "MediaRecorder error:",
        event
      );

      recordingActive = false;

    };


  mediaRecorder.start();

  recordingActive = true;


  statusBox.textContent =
    "🔴 Recording :Timestamp ON ";


  console.log(
    "Recording started:",
    formatTime(recordingStartTime)
  );


  /*
     Stop this recording after
     RECORDING_INTERVAL_MS.
  */

  mediaRecorder.start(
  RECORDING_INTERVAL_MS
);

}
/* ============================================================
   STOP TIMESTAMP VIDEO STREAM
============================================================ */

function stopTimestampVideoStream(){

  /*
     Stop canvas animation.
  */

  if(
    timestampAnimationFrame
  ){

    cancelAnimationFrame(
      timestampAnimationFrame
    );

    timestampAnimationFrame =
      null;

  }


  /*
     Stop canvas MediaStream tracks.

     IMPORTANT:

     This does NOT stop the camera.

     It only stops the temporary
     recording canvas stream.
  */

  if(
    recordingCanvasStream
  ){

    recordingCanvasStream
      .getTracks()
      .forEach(track => {

        try{

          track.stop();

        }catch(error){
          console.error(
            "Canvas track stop error:",
            error
          );
        }
      });

    recordingCanvasStream =
      null;
  }
}

/* ============================================================
   STOP RECORDING
============================================================ */

function stopRecording(){

  if(recordingTimer){

    clearTimeout(
      recordingTimer
    );

    recordingTimer = null;

  }


  if(!mediaRecorder){
    stopTimestampVideoStream();
    return;
  }

  if(
    mediaRecorder.state ===
    "recording"
  ){
    mediaRecorder.stop();
  }
}


/* ============================================================
   FINISH RECORDING
============================================================ */

async function finishRecording(){

  const endDate =
    new Date();


  const startDate =
    recordingStartTime ||
    new Date(
      endDate.getTime() -
      RECORDING_INTERVAL_MS
    );


  const filename =
    createRecordingFilename(
      startDate,
      endDate
    );


  recordingActive = false;
stopTimestampVideoStream();

  const mimeType =
    mediaRecorder &&
    mediaRecorder.mimeType

    ?

    mediaRecorder.mimeType

    :

    "video/webm";


  const blob =
    new Blob(
      recordingChunks,
      {
        type:mimeType
      }
    );


  recordingChunks = [];


  console.log(
    "Recording completed:",
    filename
  );


  console.log(
    "Video size:",
    (
      blob.size /
      1024 /
      1024
    ).toFixed(2) +
    " MB"
  );


  /*
     Upload.
  */

  await uploadRecording(
    blob,
    filename
  );


  /*
     IMPORTANT:

     If night mode started while
     uploading, DO NOT start another
     recording.
  */

  if(
    currentDayMode &&
    isRecordingTime()
  ){

    setTimeout(
      startRecording,
      1000
    );

  }else{

    statusBox.textContent =
      currentDayMode
        ? "Recording finished"
        : "Night mode";


    console.log(
      "Recording completed."
    );

  }

}


/* ============================================================
   UPLOAD VIDEO
============================================================ */

async function uploadRecording(
  blob,
  filename
){

  if(!UPLOAD_URL){

    console.warn(
      "Google Apps Script upload URL has not been configured."
    );


    statusBox.textContent =
      "Video saved locally — upload URL not configured";


    return;

  }


  uploadInProgress = true;


  statusBox.textContent =
    "Uploading " + filename;


  try{

    const base64 =
      await blobToBase64(
        blob
      );


    const payload = {

      filename:filename,

      mimeType:
        blob.type ||
        "video/webm",

      data:base64

    };


    const response =
      await fetch(
        UPLOAD_URL,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const resultText =
      await response.text();


    console.log(
      "Upload response:",
      resultText
    );


    /*
       Don't display upload status
       over night mode.
    */

    if(currentDayMode){

      statusBox.textContent =
        "Uploaded: " + filename;

    }


  }catch(error){

    console.error(
      "Upload failed:",
      error
    );


    if(currentDayMode){

      statusBox.textContent =
        "Upload failed: " + filename;

    }

  }


  uploadInProgress = false;

}


/* ============================================================
   BLOB → BASE64
============================================================ */

function blobToBase64(blob){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          const result =
            reader.result;


          const base64 =
            result.split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}

   RECORDING SCHEDULER
============================================================ */

  /*

/* ============================================================
   FACE DETECTION
============================================================ */

async function detectLoop(){

  /*
     Stop the animation loop completely
     when night mode starts.
  */

  if(
    !currentDayMode ||
    !detectionRunning
  ){

    return;

  }


  if(
    detector &&
    video.readyState >= 2
  ){

    try{

      const result =
        detector.detectForVideo(
          video,
          performance.now()
        );


      let closePerson = false;


      if(
        result.detections.length
      ){

        const box =
          result
            .detections[0]
            .boundingBox;


        const area =
          (
            box.width *
            box.height
          ) /
          (
            video.videoWidth *
            video.videoHeight
          );


        if(
          area > 0.08
        ){

          closePerson = true;

          lastSeen =
            Date.now();

        }

      }


      /*
         Visitor detection.
      */

      if(
        closePerson &&
        !triggered &&
        !showingWelcome &&
        !announcementActive
      ){

        playWelcome();

      }


      if(
        triggered
      ){

        if(
          Date.now() -
          lastSeen >
          2000
        ){

          triggered = false;


          if(currentDayMode){

            statusBox.textContent =
              recordingActive

              ?

              "🔴 Recording"

              :

              "Ready for next visitor";

          }

        }

      }

    }catch(error){

      /*
         Ignore individual AI frames.

         If the AI was closed because
         night mode started, simply exit.
      */

      if(currentDayMode){

        console.error(
          "Face detection error:",
          error
        );

      }

    }

  }


  /*
     Only continue while day mode
     is active.
  */

  if(
    currentDayMode &&
    detectionRunning
  ){

    requestAnimationFrame(
      detectLoop
    );

  }

}

/* ============================================================

async function start(){

  /*
     Determine the correct mode immediately.

     This is important.

     Example:

     Chrome starts at 10:00
     → DAY MODE

     Chrome starts at 19:00
     → NIGHT MODE
  */

  if(shouldBeDayMode()){
    currentDayMode = false;
    await enterDayMode();

  }else{

    /*
       We are starting outside
       operating hours.

       Don't initialise camera.
       Don't initialise AI.
    */
    currentDayMode = true;
    await enterNightMode();
  }
}
/* ============================================================
   START PRIMA
============================================================ */
start();
</script>
